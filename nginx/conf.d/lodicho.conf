# Rate limit agresivo sobre /api/v1/consulta: cada llamada dispara
# clasificacion + recuperacion + (eventualmente) generacion, y eso cuesta dinero.
limit_req_zone $binary_remote_addr zone=consulta_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

upstream lodicho_api {
    server api:8000;
}

# HTTP: solo sirve el reto ACME de Let's Encrypt (renovacion incluida) y
# redirige todo lo demas a HTTPS. getUserMedia (microfono de la PWA)
# requiere HTTPS, y los navegadores intentan HTTPS por default de todas
# formas — no tiene sentido servir la app real por aca.
server {
    listen 80;
    server_name lodicho.intiinside.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lodicho.intiinside.com;

    ssl_certificate     /etc/letsencrypt/live/lodicho.intiinside.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lodicho.intiinside.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    location /api/v1/consulta {
        limit_req zone=consulta_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Respuesta SSE: sin buffering ni cache, timeout largo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca cachear el service worker: el navegador debe poder detectar una
    # version nueva del app shell sin esperar a que expire un cache HTTP.
    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
