# Rate limit agresivo sobre /api/v1/consulta: cada llamada dispara
# clasificacion + recuperacion + (eventualmente) generacion, y eso cuesta dinero.
limit_req_zone $binary_remote_addr zone=consulta_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

upstream lodicho_api {
    server api:8000;
}

server {
    listen 80;
    server_name lodicho.intiinside.com;

    client_max_body_size 10M;

    location /api/v1/consulta {
        limit_req zone=consulta_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Respuesta SSE: sin buffering ni cache, timeout largo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca cachear el service worker: el navegador debe poder detectar una
    # version nueva del app shell sin esperar a que expire un cache HTTP.
    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
