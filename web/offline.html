<!doctype html>
<html lang="es-EC">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — Lo Dicho</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="offline-screen">
    <img src="icons/icon-192.png" width="72" height="72" alt="" class="offline-screen__icon" />
    <h1>Sin conexión</h1>
    <p>
      No se pudo contactar al servidor. Los datos de Lo Dicho (planes de
      trabajo, COOTAD, veredictos) nunca se muestran desde una copia
      guardada en el teléfono — necesitan red para garantizar que estén
      vigentes.
    </p>
    <button type="button" onclick="location.reload()" class="btn btn--primary">
      Reintentar
    </button>
  </div>
</body>
</html>
